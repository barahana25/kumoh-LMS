name: kumoh_lms
description: 금오공과대학교 Canvas LMS 모바일 클라이언트
publish_to: 'none'
version: 0.2.0+3

environment:
  sdk: ^3.5.0

dependencies:
  lms_folder_storage:
    path: packages/lms_folder_storage
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  drift: ^2.20.3
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.4.6
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  table_calendar: ^3.1.2
  intl: ^0.19.0
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_widget_from_html_core: ^0.15.2
  url_launcher: ^6.3.1
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  webview_flutter: ^4.14.1
  open_filex: ^4.7.0
  workmanager: ^0.10.9
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.3
  http_mock_adapter: ^0.6.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/lms_app_icon_ochungi.png
    - assets/branding/kumoh-lms-logo-v4.png
    - assets/branding/kumoh-header-transparent.png
    - assets/branding/kumoh-lms-startup-ochungi.png
